{% extends "posts/base.html" %}

{% block title %}Report Item - CampusConnect{% endblock %}

{% block content %}
    <div class="row justify-content-center">
        <div class="col-lg-7">
            <div class="card border-0 shadow-sm">
                <div class="card-body p-4 p-md-5">
                    <p class="text-primary fw-semibold mb-1">HELP THE CAMPUS</p>
                    <h1 class="fw-bold mb-4">Report a Lost or Found Item</h1>
                    <form method="post" enctype="multipart/form-data">
                        {% csrf_token %}
                        {{ form.as_p }}
                        <button class="btn btn-primary" type="submit">Publish Report</button>
                        <a class="btn btn-outline-secondary" href="/lost-found/">Cancel</a>
                    </form>
                </div>
            </div>
        </div>
    </div>
{% endblock %}
