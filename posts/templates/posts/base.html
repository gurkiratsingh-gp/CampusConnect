<!DOCTYPE html>
<html>
<head>
    <title>{% block title %}CampusConnect{% endblock %}</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >
</head>
<body class="bg-light">

    <style>
        .campus-nav { background: linear-gradient(105deg, #4f46e5, #7c3aed); }
        .brand-mark { width: 34px; height: 34px; display: inline-grid; place-items: center; border-radius: 11px; background: rgba(255,255,255,.18); }
    </style>

    <nav class="navbar navbar-dark campus-nav shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold d-flex align-items-center gap-2" href="/">
                <span class="brand-mark">🎓</span> CampusConnect
            </a>

            <div>
                <a class="btn btn-outline-light btn-sm me-2" href="/search/">Search</a>
                <a class="btn btn-outline-light btn-sm me-2" href="/lost-found/">Lost &amp; Found</a>
                <a class="btn btn-outline-light btn-sm me-2" href="/communities/">Communities</a>
                <a class="btn btn-outline-light btn-sm me-2" href="/events/">Events</a>
                {% if user.is_authenticated %}
                    <a class="btn btn-light btn-sm me-2" href="/create-post/">Create Post</a>
                    <a class="btn btn-outline-light btn-sm me-2" href="/dashboard/">Dashboard</a>
                    <a class="btn btn-outline-light btn-sm me-2" href="/saved-posts/">Saved</a>
                    <a class="btn btn-outline-light btn-sm me-2" href="/notifications/">Notifications</a>
                    <a class="btn btn-outline-light btn-sm me-2" href="/profile/{{ user.username }}/">Profile</a>

                    <form class="d-inline" method="post" action="/accounts/logout/">
                        {% csrf_token %}
                        <button class="btn btn-outline-light btn-sm" type="submit">
                            Logout
                        </button>
                    </form>
                {% else %}
                    <a class="btn btn-outline-light btn-sm me-2" href="/accounts/login/">
                        Login
                    </a>
                    <a class="btn btn-light btn-sm" href="/signup/">
                        Sign Up
                    </a>
                {% endif %}
            </div>
        </div>
    </nav>

    <main class="container py-5">
        {% block content %}{% endblock %}
    </main>

</body>
</html>
